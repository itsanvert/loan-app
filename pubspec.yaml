name: loanapp
description: "loan calculate application"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  pdf: ^3.10.0
  printing: ^5.11.0
  excel: ^2.1.0
  file_saver: ^0.2.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/image.png
    - assets/KhmerOSContent.ttf

  fonts:
    - family: KhmerOS
      fonts:
        - asset: assets/KhmerOSContent.ttf
